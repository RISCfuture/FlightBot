services:
  - type: keyvalue
    name: flightbot-redis
    plan: free
    region: oregon
    ipAllowList: []

  - type: web
    name: FlightBot
    env: node
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    plan: free
    branch: main
    envVars:
      - key: NODE_VERSION
        value: 26.7.0
      - key: NODE_ENV
        value: production
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      - key: FLIGHTAWARE_API_KEY
        sync: false
      - key: AVIATIONSTACK_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: PORT
        value: 10000
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: flightbot-redis
          property: connectionString
